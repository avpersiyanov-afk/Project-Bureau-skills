tooltip: |
  Приближает вид к элементу. Если элемент уже выбран в модели — просто зумирует к нему (к нескольким выбранным — к их общему габариту). Если ничего не выбрано — спрашивает ID элемента и зумирует к нему. Если элемента не видно на активном виде, подсказывает, на какой уровень (план/разрез/3D) переключиться, чтобы он был заметен.
