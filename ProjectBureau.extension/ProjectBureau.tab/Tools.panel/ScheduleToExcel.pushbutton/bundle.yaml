tooltip: Выгружает спецификацию в файл .xlsx (openpyxl и Excel не нужны). Первый столбец — «Revit ID» (связь со строкой, не трогать), дальше значения параметров по столбцам. Активная спецификация берётся сама, иначе спросит какую. Выгружаются параметры экземпляров. Правьте в Excel и грузите обратно кнопкой «Импорт из Эксель».
