tooltip: Загружает семейства из папки-каталога .rfa в модель. Сначала — выбор разделов каталога (папок с .rfa; можно несколько, Отмена = все), затем сортируемая таблица по файлам с галочками — имя файла, папка, есть ли уже в модели, дата файла. Зелёным — новые, серым — уже загруженные (будут перезагружены с заменой параметров типов). Отмеченные загружаются в модель и получают скрытую метку даты каталога (её потом читает кнопка «Семейства из каталога»). Флажок «Выбрать типоразмеры» открывает каждый отмеченный .rfa, читает список типов и даёт отметить нужные — грузятся только они (LoadFamilySymbol), иначе семейство целиком. Флажок «заменять значения параметров типоразмеров» влияет только на семейства, уже присутствующие в модели (как выбор в диалоге браузера). Путь к каталогу общий с кнопкой «Семейства из каталога»; Shift+клик — сменить папку.
