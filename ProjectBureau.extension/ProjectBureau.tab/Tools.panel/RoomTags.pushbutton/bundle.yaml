tooltip: |
  Расставляет и обновляет марки помещений из связанной модели на активном плане. Типоразмер марки выбирается из списка. Марки, чья голова вышла за границы своего помещения (частая причина «?» — Revit сам её не пересчитывает), возвращает на место. По-настоящему битые марки (помещение удалено/переделано у АР, марка осиротела или помещение не окружено) пересоздаёт на месте, а если помещения под маркой уже нет — удаляет. На время вставки снимает подложку вида, мешающую ставить марки помещений.

  Shift+клик — выбрать несколько планов списком и обновить марки сразу на всех.
